name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch supersedes an in-flight run; there is no value
# in paying for CI on a commit that has already been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.12.3"
  PYTHON_VERSION: "3.11"
  # uv otherwise picks 3.12 (newest allowed by requires-python), whose numpy
  # stubs mypy cannot parse under python_version = 3.11.
  UV_PYTHON: "3.11"

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the scan covers every commit on the branch, not
          # just the tip — a secret removed in a later commit is still leaked.
          fetch-depth: 0
      - name: Fail if a dotenv file was committed
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked by git. Remove it and rotate every value it contained."
            exit 1
          fi
          echo "No tracked .env file."
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend (lint, types, architecture, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        # --frozen fails if uv.lock is out of date with pyproject.toml, which
        # prevents CI from silently testing a different dependency set than developers.
        run: uv sync --all-groups --frozen

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Type check
        run: uv run mypy

      - name: Architecture contracts
        run: uv run lint-imports

      - name: Unit tests
        run: uv run pytest -m "not integration and not e2e" --cov --cov-report=term-missing

  frontend:
    name: Frontend (format, lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        # `npm ci` installs exactly the lockfile and fails if it disagrees with
        # package.json, so CI can never test a different dependency set.
        run: npm ci --no-audit --no-fund

      - name: Format check
        run: npm run format:check

      - name: Lint
        # Next 16 removed the build-time ESLint hook, so this is its own gate
        # rather than a side effect of `next build`.
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit and component tests
        run: npm run test

      - name: Build
        run: npm run build

  contract:
    name: API contract (generated frontend types match the backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --all-groups --frozen

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Generated types are current
        # The frontend's types are *generated* from the backend's OpenAPI schema
        # (ADR-0016), so a backend change that is not followed by regenerating them
        # would otherwise ship a frontend compiled against a contract that no longer
        # exists. This turns that drift into a failing build.
        working-directory: web
        run: npm run api:types:check

  images:
    name: Container images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose:
    name: Compose stack boots healthy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Generate ephemeral local configuration
        # CI never uses the committed placeholders; it mints throwaway values so
        # that a leaked workflow log cannot reveal anything reusable. The
        # generated credentials are masked and exported for later steps.
        run: |
          python - <<'PY'
          import os
          import secrets
          from pathlib import Path

          pw = secrets.token_urlsafe(24)
          minio_pw = secrets.token_urlsafe(24)
          minio_user = "orbit-ci"

          text = Path(".env.example").read_text()
          text = text.replace("change-me-local-only@localhost", f"{pw}@localhost")
          text = text.replace("POSTGRES_PASSWORD=change-me-local-only", f"POSTGRES_PASSWORD={pw}")
          text = text.replace("MINIO_ROOT_USER=orbit-local", f"MINIO_ROOT_USER={minio_user}")
          text = text.replace("MINIO_ROOT_PASSWORD=change-me-local-only", f"MINIO_ROOT_PASSWORD={minio_pw}")
          text = text.replace("ORBIT_S3_ACCESS_KEY_ID=orbit-local", f"ORBIT_S3_ACCESS_KEY_ID={minio_user}")
          text = text.replace("ORBIT_S3_SECRET_ACCESS_KEY=change-me-local-only", f"ORBIT_S3_SECRET_ACCESS_KEY={minio_pw}")
          text = text.replace("REPLACE_ME_WITH_A_64_BYTE_URLSAFE_RANDOM_STRING", secrets.token_urlsafe(64))
          Path(".env").write_text(text)

          # Mask before export so a later step cannot echo them into the log.
          for value in (pw, minio_pw):
              print(f"::add-mask::{value}")
          exports = [
              f"PG_PASSWORD={pw}",
              f"MINIO_USER={minio_user}",
              f"MINIO_PASSWORD={minio_pw}",
          ]
          with Path(os.environ["GITHUB_ENV"]).open("a") as env_file:
              env_file.write(chr(10).join(exports) + chr(10))
          PY

      - name: Validate compose configuration
        run: docker compose config --quiet

      - name: Start infrastructure
        run: docker compose up --wait --wait-timeout 180 postgres redis minio

      - name: Verify pgvector and extensions are available
        run: |
          docker compose exec -T postgres psql -U orbit -d orbit -c \
            "SELECT extname FROM pg_extension WHERE extname IN ('vector','pg_trgm','uuid-ossp') ORDER BY extname;"
          docker compose exec -T postgres psql -U orbit -d orbit -tAc \
            "SELECT count(*) FROM pg_extension WHERE extname IN ('vector','pg_trgm','uuid-ossp');" | grep -qx 3

      - name: Verify the test database was provisioned
        run: docker compose exec -T postgres psql -U orbit -d orbit_test -c "SELECT 1;"

      - name: Verify bucket provisioning completed
        run: |
          docker compose up --exit-code-from minio-init minio-init
          docker compose logs minio-init | grep -q "ready"

      - name: Run integration tests against the live stack
        working-directory: backend
        env:
          ORBIT_TEST_DATABASE_URL: postgresql+asyncpg://orbit:${{ env.PG_PASSWORD }}@localhost:5432/orbit_test
          ORBIT_REDIS_URL: redis://localhost:6379/9
          ORBIT_S3_ENDPOINT_URL: http://localhost:9000
          ORBIT_S3_BUCKET: orbit-documents
          ORBIT_S3_ACCESS_KEY_ID: ${{ env.MINIO_USER }}
          ORBIT_S3_SECRET_ACCESS_KEY: ${{ env.MINIO_PASSWORD }}
        run: |
          uv sync --all-groups --frozen
          uv run pytest -m integration -v

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v

  e2e:
    name: End-to-end journeys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json

      - name: Generate ephemeral local configuration
        # Same reasoning as the compose job: throwaway credentials, so a leaked
        # log reveals nothing reusable. No AI key is minted, and none is needed --
        # the stack under test runs ORBIT's deterministic `fake` provider (ADR-0007).
        run: |
          python - <<'PY'
          import secrets
          from pathlib import Path

          text = Path(".env.example").read_text()
          pw = secrets.token_urlsafe(24)
          minio_pw = secrets.token_urlsafe(24)
          text = text.replace("change-me-local-only@localhost", f"{pw}@localhost")
          text = text.replace("POSTGRES_PASSWORD=change-me-local-only", f"POSTGRES_PASSWORD={pw}")
          text = text.replace("MINIO_ROOT_USER=orbit-local", "MINIO_ROOT_USER=orbit-ci")
          text = text.replace("MINIO_ROOT_PASSWORD=change-me-local-only", f"MINIO_ROOT_PASSWORD={minio_pw}")
          text = text.replace("ORBIT_S3_ACCESS_KEY_ID=orbit-local", "ORBIT_S3_ACCESS_KEY_ID=orbit-ci")
          text = text.replace("ORBIT_S3_SECRET_ACCESS_KEY=change-me-local-only", f"ORBIT_S3_SECRET_ACCESS_KEY={minio_pw}")
          text = text.replace("REPLACE_ME_WITH_A_64_BYTE_URLSAFE_RANDOM_STRING", secrets.token_urlsafe(64))
          Path(".env").write_text(text)
          for value in (pw, minio_pw):
              print(f"::add-mask::{value}")
          PY

      - name: Start infrastructure
        run: |
          docker compose up --wait --wait-timeout 180 postgres redis minio
          docker compose up --exit-code-from minio-init minio-init

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --all-groups --frozen

      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Install end-to-end dependencies
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Type check
        working-directory: e2e
        run: npm run typecheck

      - name: Run end-to-end tests
        # Playwright starts the API, the worker, and a production web build
        # itself, on ports and a database of their own (see e2e/README.md).
        working-directory: e2e
        run: npm test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/.artifacts
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose down -v
